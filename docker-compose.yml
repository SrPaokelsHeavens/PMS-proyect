services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hotel_os_postgres:/var/lib/postgresql/data

volumes:
  hotel_os_postgres:
